<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advent v Bunkru · Bunker Timpo</title>
<meta name="description" content="24 okének, každý den jedno. Adventní kalendář posilovny Bunker Timpo, OD Timpo, Olomouc - Neředín.">
<meta property="og:title" content="Advent v Bunkru">
<meta property="og:description" content="24 okének, každý den jedno. Tipy, výzvy a pár dárků od Bunker Timpo.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1A1B1D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styl.css">
</head>
<body>
  <header class="hlavicka">
    <div class="hlavicka__logo">
      <img src="logo/bt-logo-bile.png" alt="Bunker Timpo" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <span class="slovni-znacka" hidden>BUNKER TIMPO</span>
    </div>
    <p class="label" id="stav">ADVENT 2026</p>
    <h1 class="titulek" id="uvod-nadpis">ADVENT V BUNKRU</h1>
    <div class="uvod-text" id="uvod-text"></div>
  </header>

  <div class="pruh" aria-hidden="true"></div>

  <main>
    <p class="nahled-info" id="nahled-info" hidden>NÁHLED: všechna okénka jsou odemčená. Lidé bez ?nahled=1 v adrese je vidí podle data.</p>
    <div class="mrizka" id="mrizka" aria-label="Okénka adventního kalendáře"></div>
  </main>

  <footer class="paticka">
    <p><strong>Bunker Timpo</strong> · OD Timpo, Olomouc - Neředín</p>
    <p>
      <a href="https://www.instagram.com/bunker_timpo">Instagram @bunker_timpo</a> ·
      <a href="https://www.facebook.com/bunkertimpo">facebook.com/bunkertimpo</a> ·
      <a href="https://bunkertimpo.cz">bunkertimpo.cz</a>
    </p>
  </footer>

  <dialog class="okno" id="okno" aria-labelledby="okno-nadpis">
    <div class="okno__pruh" aria-hidden="true"></div>
    <button class="okno__zavrit" id="okno-zavrit" type="button">ZAVŘÍT ✕</button>
    <div class="okno__obsah">
      <div class="okno__foto" id="okno-foto"></div>
      <p class="label" id="okno-datum"></p>
      <h2 class="okno__nadpis" id="okno-nadpis"></h2>
      <div class="okno__text" id="okno-text"></div>
      <a class="tlacitko" id="okno-odkaz" target="_blank" rel="noopener" hidden></a>
    </div>
  </dialog>

  <div class="hlaska" id="hlaska" role="status" aria-live="polite"></div>

  <script src="kalendar.js"></script>
</body>
</html>
