<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advent v Bunkru · Bunker Timpo</title>
<meta name="description" content="24 okének, každý den jedno. Adventní kalendář posilovny Bunker Timpo, OD Timpo, Olomouc - Neředín.">
<meta property="og:title" content="Advent v Bunkru">
<meta property="og:description" content="24 okének, každý den jedno. Tipy, výzvy a pár dárků od Bunker Timpo.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1A1B1D">
<link rel="icon" href="logo/bt-logo-bile.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styl.css">
</head>
<body>
  <div class="nahled-lista" id="nahled-lista" hidden>
    <span class="nahled-lista__stitek">NÁHLED</span>
    <label for="nahled-den">Ukaž, jak to vypadá:</label>
    <select id="nahled-den"></select>
    <button type="button" id="nahled-reset">Zavřít všechna okénka</button>
  </div>

  <header class="hlavicka">
    <div class="strop">
      <img class="strop__logo" src="logo/bt-logo-bile.svg" alt="Bunker Timpo">
      <div class="strop__text">
        <span class="strop__nazev">BUNKER TIMPO</span>
        <span class="label">OD Timpo · Olomouc - Neředín</span>
      </div>
      <button class="zvuk" id="zvuk" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path id="zvuk-vlny" fill="none" stroke="currentColor" stroke-width="2" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="zvuk-krizek" stroke="currentColor" stroke-width="2" d="M16 9l6 6M22 9l-6 6"/></svg>
        <span id="zvuk-text">ZVUK VYP</span>
      </button>
    </div>
    <p class="label hlavicka__nadtitul" id="stav">ADVENT 2026</p>
    <h1 class="titulek" id="uvod-nadpis">ADVENT V BUNKRU</h1>
    <div class="uvod-text" id="uvod-text"></div>
  </header>

  <div class="pruh" aria-hidden="true"><span></span></div>

  <section class="odpocet" id="odpocet" hidden aria-live="off">
    <p class="label">PRVNÍ OKÉNKO SE OTEVŘE ZA</p>
    <div class="odpocet__cisla">
      <div><b id="o-dny">00</b><span>DNÍ</span></div>
      <div><b id="o-hod">00</b><span>HODIN</span></div>
      <div><b id="o-min">00</b><span>MINUT</span></div>
      <div><b id="o-sek">00</b><span>SEKUND</span></div>
    </div>
  </section>

  <main>
    <div class="postup" id="postup" hidden>
      <p class="label">OTEVŘENO <b id="postup-pocet">0</b> / 24</p>
      <div class="postup__draha"><span id="postup-pruh"></span></div>
    </div>
    <div class="mrizka" id="mrizka" aria-label="Okénka adventního kalendáře"></div>
  </main>

  <footer class="paticka">
    <img class="paticka__logo" src="logo/bt-logo-bile.svg" alt="">
    <div>
      <p><strong>BUNKER TIMPO</strong></p>
      <p>OD Timpo, Olomouc - Neředín</p>
      <p>
        <a href="https://www.instagram.com/bunker_timpo">Instagram @bunker_timpo</a> ·
        <a href="https://www.facebook.com/bunkertimpo">facebook.com/bunkertimpo</a> ·
        <a href="https://bunkertimpo.cz">bunkertimpo.cz</a>
      </p>
    </div>
  </footer>

  <dialog class="okno" id="okno" aria-labelledby="okno-nadpis">
    <div class="okno__pruh" aria-hidden="true"><span></span></div>
    <button class="okno__zavrit" id="okno-zavrit" type="button">ZAVŘÍT ✕</button>
    <div class="okno__foto" id="okno-foto"></div>
    <div class="okno__obsah">
      <p class="label" id="okno-datum"></p>
      <h2 class="okno__nadpis" id="okno-nadpis"></h2>
      <div class="okno__text" id="okno-text"></div>
      <div class="tlacitka">
        <button class="tlacitko tlacitko--obrys" id="okno-sdilet" type="button">POŠLI TO PARTĚ</button>
      </div>
    </div>
  </dialog>

  <div class="hlaska" id="hlaska" role="status" aria-live="polite"></div>

  <script src="kalendar.js"></script>
</body>
</html>
